<html>
<head>
	<title>Vokativ</title>
	<meta charset="utf-8">
	<meta name="HandheldFriendly" content="True">
	<meta name="MobileOptimized" content="320">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
<body>

<textarea id="input"></textarea>

<textarea id="output" readonly="true"></textarea>
<textarea id="rules" readonly="true"></textarea>

<br/>

<input type="button" value="test" onclick="test();">

<textarea id="totest" style="display: none;">

</textarea>

<script>
var input = document.getElementById('input');
var output = document.getElementById('output');
var rule = document.getElementById('rules');
var totest = document.getElementById('totest');

function rules(inrule) {
	rule.value += inrule+"\n";
}

function rename (inname) {
	var outname = '';

	inname = inname.trim();

	var lastchar = inname.slice(-1);
	var beforelastchar = inname.slice(-2).charAt(0);
	var namelength = inname.length;
	// Diactic converted by http://unicode-table.com/en/
	switch (lastchar) {
		// 1: -a -> -o
		case "a":
			outname = inname.substring(0, namelength - 1)+'o';
			rules("1.");
			break;
		// 2.a: -ž,š,č,ř -> +i
		case "\u017E": // ž
		case "\u0161": // š
		case "\u010D": // č
		case "\u0159": // ř
			outname = inname+'i';
			rules("2.a");
			break;
		// 2.b: -ď,ť,ň -> d/t/n+i
		case "\u010F": // ď
			outname = inname.substring(0, namelength - 1)+'di';
			rules("2.b-ď");
			break;
		case "\u0165": // ť
			outname = inname.substring(0, namelength - 1)+'ti';
			rules("2.b-ť");
			break;
		case "\u0148": // ň
			outname = inname.substring(0, namelength - 1)+'ni';
			rules("2.b-ň");
			break;
		// 3.1
		case "ch":
		case "h":
			outname = inname+'u';
			rules("3.a");
			break;
		// 3.b 
		case "k":
			if (beforelastchar == "e") {
				outname = inname.substring(0, namelength - 2)+'ku';
				rules("3.b.1");
			} else {
				outname = inname+'u';
				rules("3.b.2");
			}
			break;
		// 4.a
		case "c":
			if (beforelastchar == "e") {
				outname = inname.substring(0, namelength - 2)+'če';
				rules("4.a.1");
			} else {
				outname = inname+'e ('+beforelastchar+')';
				rules("4.a.2");
			}
			break;
		// 4.b
		case "r":
			outname = "NOT IMPLEMENTED";
			rules("4.b");
			break;
		// 5.a
		case "n":
		case "r":
			outname = inname+'e';
			rules("5.a");
			break;
		// 5.b 
		case "l":
			if (beforelastchar == "e") {
				outname = inname.substring(0, namelength - 2)+'le';
				rules("5.b.1");
			} else {
				outname = inname+'e';
				rules("5.b.2");
			}
			break;
		// 6.
		case "e":
			outname = inname;
			rules("6.");
			break;
		default:
			outname = inname;
			rules("default");
	}

	return outname;
}

function process () {
	var rawnames = input.value.trim();

	var innames = rawnames.split("\n");
	output.value = "";
	rule.value = "";

	input.rows = innames.length + 1;
	output.rows = innames.length + 1;
	rule.rows = innames.length + 1;
	
	for (var index = 0; index < innames.length; index++) {
		inname = innames[index];
		output.value += rename(inname);
		output.value += "\n";
	}

}

if (input.addEventListener) {
	input.addEventListener('input', function() {
    		// event handling code for sane browsers
		process();
  	}, false);
} else if (input.attachEvent) {
  	input.attachEvent('onpropertychange', function() {
    		// IE-specific event handling code
		process();
  	});
}

function test() {

	input.value = totest.value;
	process();
}
</script>

</body>
</html>
